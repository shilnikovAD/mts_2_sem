spring:
  application:
    name: mts 2_sem
  datasource:
    url: jdbc:postgresql://localhost:5432/test_db
    username: sa
    password: sa
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true

server:
  port: 8081

